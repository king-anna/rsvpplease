name: Refresh sitemap (blog posts)

# Regenerates sitemap.xml daily with every published blog post and commits it
# to main. The site deploys from the repo on push, so the committed sitemap
# goes live automatically — no Cloudflare credentials needed.
#
# Replaces the old "Deploy frontend to Cloudflare Pages" workflow, which
# failed on every run because the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# repository secrets were never set.

on:
  workflow_dispatch:
  # Daily so blog posts published via the blog-webhook reach sitemap.xml.
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sitemap.xml (static pages + published blog posts)
        run: node tools/gen-sitemap.js

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Sitemap: daily refresh with published blog posts"
          git push
